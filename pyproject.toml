[project]
name = "data-man"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ipython>=9.17.1",
    "langchain>=1.4.2",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.4.0",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.6.6",
    "pandas>=2.0.0",
    "pydantic>=2.13.5",
    "pydantic-ai>=2.49.0",
    "python-dotenv>=1.2.3",
    "streamlit>=1.49.0",
    "text-to-sql>=0.0.6",
    "typesafe-sdk>=0.7.2",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: import sorting, B: bugbear, UP: pyupgrade
select = ["E", "W", "F", "I", "B", "UP"]
# Long lines are handled by `ruff format`; long strings/comments it can't wrap are allowed.
ignore = ["E501"]
extend-safe-fixes = ["W291"]
